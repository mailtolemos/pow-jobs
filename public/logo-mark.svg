<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" fill="none" role="img" aria-label="ProWo">
  <defs>
    <linearGradient id="prowo-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="prowo-stem-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="prowo-bowl-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B6BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="prowo-bowl-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="prowo-bowl-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="prowo-fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="prowo-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
  </defs>
  <!-- Top triangular fold above the bowl -->
  <path d="M165 80 L355 80 L255 200 Z" fill="url(#prowo-bowl-top)"/>
  <!-- Upper-right diagonal facet (paper fold edge on the right) -->
  <path d="M355 80 L420 200 L320 280 L255 200 Z" fill="url(#prowo-bowl-light)"/>
  <!-- Main bowl front-face (the P loop) -->
  <path d="M165 80 L255 200 L320 280 L165 280 Z" fill="url(#prowo-stem)"/>
  <!-- Lower bowl fold / inner highlight -->
  <path d="M165 280 L320 280 L260 380 L165 380 Z" fill="url(#prowo-fold)"/>
  <!-- Right edge of inner fold -->
  <path d="M320 280 L355 320 L260 380 Z" fill="url(#prowo-bowl-back)"/>
  <!-- Stem (descender) -->
  <path d="M165 80 L235 80 L195 540 L130 540 Z" fill="url(#prowo-stem-dark)"/>
  <!-- Stem inner highlight -->
  <path d="M165 80 L165 540 L130 540 Z" fill="url(#prowo-stem)" opacity="0.55"/>
  <!-- Bottom of the stem darker shadow -->
  <path d="M195 540 L130 540 L150 580 L185 580 Z" fill="url(#prowo-bottom)"/>
</svg>
